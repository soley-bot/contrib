name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: contrib/package-lock.json

      - name: Install dependencies
        working-directory: contrib
        run: npm ci

      - name: Type check
        working-directory: contrib
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: contrib
        run: npx vitest run

      - name: Build
        working-directory: contrib
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          TELEGRAM_BOT_TOKEN: placeholder
          TELEGRAM_WEBHOOK_SECRET: placeholder
          KV_REST_API_URL: https://placeholder.upstash.io
          KV_REST_API_TOKEN: placeholder
          SENTRY_DSN: ""
          SENTRY_ORG: placeholder
          SENTRY_PROJECT: placeholder
